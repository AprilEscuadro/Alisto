# Disables the Pi's WiFi power-save mode (NetworkManager's own setting --
# this device uses nmcli/NetworkManager for networking, see
# alisto_auto_fallback.py and wifi_setup_server.py).
#
# WHY: under the default power-save mode, the WiFi radio periodically
# sleeps and wakes to check for traffic. Each wake draws a brief current
# spike, which -- sharing a power rail/ground with the MAX98357A audio
# amp -- couples into the I2S audio line as an audible "knock" through the
# speaker. Real testing: most noticeable during otherwise-quiet medicine
# reminder audio and right around WiFi (re)connection, when these wake
# bursts are most frequent, while the much louder emergency TTS
# announcement mostly masks the same artifact. Disabling power-save stops
# the periodic sleep/wake cycle rather than trying to filter its effect.
#
# wifi.powersave values (NetworkManager): 0 = use driver default,
# 1 = never touch the setting, 2 = disable power-save, 3 = enable it.
# This is config, not firmware/hardware -- applied by NetworkManager
# itself on every boot/reconnect, no extra service or root command needed
# at runtime.
#
# DEPLOY (one-time, on the Pi):
#   sudo cp network/99-wifi-powersave-off.conf /etc/NetworkManager/conf.d/
#   sudo systemctl restart NetworkManager
[connection]
wifi.powersave = 2
